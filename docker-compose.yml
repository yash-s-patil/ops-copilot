name: opscp

services:
  postgres:
    image: postgres:17@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run `make env` to create .env first}
      AGENT_DATABASE_PASSWORD: ${AGENT_DATABASE_PASSWORD:?Run `make env` to create .env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.38.0@sha256:c26024d62bf4a5b88a40968afd217234c00e1fc9a4790dc6105d1ca7979f6eec
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data"]
    environment:
      AZURITE_ACCOUNTS: ${AZURITE_ACCOUNTS:-}
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "10000"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp:
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    environment:
      ENVIRONMENT: local
      DATABASE_HOST: postgres
      DATABASE_NAME: meridian
      DATABASE_USER: mcp_app
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run `make env` to create .env first}
      POLICIES_CONTAINER: ${POLICIES_CONTAINER:-}
      BLOB_CONNECTION_STRING: ${BLOB_CONNECTION_STRING_IN_COMPOSE:-}
      AUTH_MODE: dev
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      MCP_API_AUDIENCE: ${MCP_API_AUDIENCE:-}
      DEV_ISSUER: ${DEV_ISSUER:-}
      DEV_ISSUER_PUBLIC_KEY: ${DEV_ISSUER_PUBLIC_KEY:-}
      APPROVAL_SIGNING_KEY: ${APPROVAL_SIGNING_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  payments-sim:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    command: ["python", "-m", "opscp_payments.sim"]
    environment:
      ENVIRONMENT: local
      AUTH_MODE: dev
      PAYMENTS_API_AUDIENCE: ${PAYMENTS_API_AUDIENCE:-}
      DEV_ISSUER: ${PAYMENTS_DEV_ISSUER:-}
      DEV_ISSUER_PUBLIC_KEY: ${PAYMENTS_DEV_PUBLIC_KEY:-}
      SIM_ALLOW_FORCED_OUTCOME: "true"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 6
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  payments-worker:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      ENVIRONMENT: local
      DATABASE_HOST: postgres
      DATABASE_NAME: meridian
      DATABASE_USER: payments_worker
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Run `make env` to create .env first}
      AUTH_MODE: dev
      PAYMENTS_URL: http://payments-sim:8080
      PAYMENTS_API_AUDIENCE: ${PAYMENTS_API_AUDIENCE:-}
      DEV_ISSUER: ${PAYMENTS_DEV_ISSUER:-}
      # A key of the worker's own. The key that signs people in is given to no container.
      DEV_ISSUER_PRIVATE_KEY: ${PAYMENTS_DEV_PRIVATE_KEY:-}
      CHAOS_ENABLED: "true"
      HEARTBEAT_FILE: /tmp/heartbeat
    tmpfs:
      - /tmp
    healthcheck:
      # The worker listens on nothing. It touches a file after every poll; alive means the
      # file is fresh.
      test:
        - CMD
        - python
        - -c
        - "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/heartbeat') > 30)"
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      payments-sim:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  dev-issuer:
    # Stands in for Microsoft Entra ID's token endpoint. It exists only in this file.
    build:
      context: .
      dockerfile: infra/local/issuer/Dockerfile
    environment:
      ENVIRONMENT: local
      DEV_ISSUER: ${DEV_ISSUER:-}
      DEV_ISSUER_PRIVATE_KEY: ${DEV_ISSUER_PRIVATE_KEY:-}
      AGENT_API_AUDIENCE: ${AGENT_API_AUDIENCE:-}
      AGENT_API_CLIENT_ID: ${AGENT_API_CLIENT_ID:-}
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:-}
      MCP_API_AUDIENCE: ${MCP_API_AUDIENCE:-}
      WEB_CLIENT_ID: ${WEB_CLIENT_ID:-}
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:-}
    ports:
      # For the web application when it is run on this machine with `pnpm dev`.
      - "127.0.0.1:8090:8090"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      ENVIRONMENT: local
      # Its own database, role and password. None of them opens meridian, and it is given
      # nothing for the storage.
      DATABASE_HOST: postgres
      DATABASE_NAME: copilot
      DATABASE_USER: agent_app
      DATABASE_PASSWORD: ${AGENT_DATABASE_PASSWORD:?Run `make env` to create .env first}
      AUTH_MODE: dev
      AGENT_API_AUDIENCE: ${AGENT_API_AUDIENCE:-}
      AGENT_API_CLIENT_ID: ${AGENT_API_CLIENT_ID:-}
      DEV_ISSUER: ${DEV_ISSUER:-}
      DEV_ISSUER_PUBLIC_KEY: ${DEV_ISSUER_PUBLIC_KEY:-}
      MCP_URL: http://mcp:8000
      MCP_SCOPE: ${MCP_API_AUDIENCE:-}/.default
      OBO_CREDENTIAL: secret
      TOKEN_URL: http://dev-issuer:8090/token
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:-}
      LLM_PROVIDER: scripted
      CANARY: ${AGENT_CANARY:-}
      # A round figure for local development. A deployment sets the rate it was given.
      USD_INR_RATE: "90"
      CHAOS_ENABLED: "true"
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      mcp:
        condition: service_healthy
      dev-issuer:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      ENVIRONMENT: local
      AUTH_MODE: dev
      AUTH_TRUST_HOST: "true"
      AUTH_URL: http://localhost:3000
      AUTH_SECRET: ${WEB_AUTH_SECRET:-}
      AGENT_URL: http://agent:8001
      AGENT_SCOPE: ${AGENT_API_AUDIENCE:-}/Agent.Access
      DEV_TOKEN_URL: http://dev-issuer:8090/token
      WEB_CLIENT_ID: ${WEB_CLIENT_ID:-}
      WEB_CLIENT_SECRET: ${WEB_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      # Next.js writes its cache beside the server, and the root filesystem is read-only.
      - /app/.next/cache
    depends_on:
      agent:
        condition: service_healthy
      dev-issuer:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
  azurite-data:
