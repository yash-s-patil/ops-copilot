[project]
name = "opscp-common"
version = "0.1.0"
description = "Code shared by the Ops Copilot services: configuration, limits, errors, logging and telemetry."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.4",
    "rfc8785>=0.1.4",
    "sqlalchemy>=2.1.9",
    "structlog>=25",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"
