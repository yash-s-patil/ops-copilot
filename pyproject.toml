[project]
name = "ops-copilot"
version = "0.1.0"
description = "Workspace root for the Ops Copilot services. Not a distributable package."
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["jobs/*", "packages/*", "services/*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "S", "BLE", "T20", "ERA", "TD", "FIX",
    "C4", "SIM", "PTH", "PT", "RET", "ASYNC", "TID", "RUF", "C90", "PLR0912", "PLR0913", "PLR0915",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "TID252"]
"jobs/seed/**" = ["S311"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 50
max-branches = 10
max-args = 6

[tool.ruff.lint.isort]
known-first-party = ["opscp_common", "opscp_mcp", "opscp_mcp_testing", "opscp_seed"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.13"
include = ["jobs", "packages", "services"]
exclude = ["**/.venv", "**/node_modules", "**/__pycache__"]
extraPaths = ["services/mcp/tests"]
reportMissingTypeStubs = "error"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["jobs", "packages", "services"]
pythonpath = ["services/mcp/tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs the local PostgreSQL from `make dev`"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source_pkgs = ["opscp_common", "opscp_mcp", "opscp_seed"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]
