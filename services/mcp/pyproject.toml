[project]
name = "opscp-mcp"
version = "0.1.0"
description = "The Ops Copilot MCP server: owns every rule about data access and writes."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastmcp>=4.2",
    "opscp-common",
    "sqlalchemy[asyncio]>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
opscp-common = { workspace = true }
