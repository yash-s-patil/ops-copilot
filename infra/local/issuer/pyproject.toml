[project]
name = "opscp-dev-issuer"
version = "0.1.0"
description = "Local stand-in for Microsoft Entra ID's token endpoint. Never deployed."
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "cryptography>=50",
    "fastapi>=0.133",
    "joserfc>=1.8",
    "opscp-common",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54",
]

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
opscp-common = { workspace = true }
